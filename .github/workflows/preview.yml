name: Preview

# PR preview environments. Each open PR labeled `preview` gets its own copy of
# Glyph (frontend, API, collab and a one-instance Postgres seeded with demo
# data) at https://pr-<number>.glyph-preview.kurpuis.com, created by an Argo
# CD ApplicationSet with a pull-request generator in the homelab repo
# (kubernetes/argocd/glyph/). Argo CD deletes the environment, database
# included, when the PR closes or loses the label.
#
# This workflow opts PRs in: it labels every same-repo PR `preview` when it is
# opened, reopened or pushed to (so a push revives an expired preview), unless
# the PR is labeled `no-preview`. Adding `no-preview` removes `preview`, which
# is what takes the PR out of the ApplicationSet. preview-expiry.yml removes
# the label from PRs that go quiet. Fork PRs are skipped: their CI gets no registry
# credentials, so no image is ever built for them to run.
#
# The preview runs the image ci.yml's build-preview-image job builds from the
# PR's head commit (the same commit whose chart and migrations Argo CD
# renders) and publishes as sha-<head commit>, so it comes up once CI has
# passed for that push; until then the previous push's pods keep serving.

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled]

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  label:
    if: >-
      github.repository == 'imaustink/glyph' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (github.event.action != 'labeled' || github.event.label.name == 'preview' || github.event.label.name == 'no-preview')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number }}
    steps:
      - name: Label and link the preview
        run: |
          set -euo pipefail
          labels="$(gh pr view "$PR" --json labels --jq '.labels[].name')"
          if grep -qx 'no-preview' <<<"$labels"; then
            # The ApplicationSet selects on `preview` alone, so opting out means removing it.
            if grep -qx 'preview' <<<"$labels"; then
              gh pr edit "$PR" --remove-label preview
            fi
            echo "PR is labeled no-preview — skipping"
            exit 0
          fi

          if ! grep -qx 'preview' <<<"$labels"; then
            gh label create preview --color 0e8a16 \
              --description "Deploy a preview environment (removed after inactivity)" 2>/dev/null || true
            gh pr edit "$PR" --add-label preview
          fi

          url="https://pr-$PR.glyph-preview.kurpuis.com"
          marker='<!-- glyph-preview -->'
          body="$marker
          **Preview:** $url

          Deployed by Argo CD once CI passes for the latest push, with demo data you can edit; sign in with Google as usual. It's deleted when this PR closes or after 7 days without activity (add the \`preview\` label, or push, to bring it back). Label the PR \`no-preview\` to opt out."

          existing="$(gh api "repos/$GH_REPO/issues/$PR/comments" --paginate \
            --jq ".[] | select(.body | startswith(\"$marker\")) | .id" | head -n1)"
          if [ -z "$existing" ]; then
            gh pr comment "$PR" --body "$body"
          fi
