name: Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: arc-runner-set
    # Self-hosted runner: only ever reachable via push to main (collaborators only).
    # Guard so a fork that somehow re-targets this job cannot run it on our infra.
    if: github.repository == 'imaustink/glyph'
    steps:
      - uses: actions/checkout@v4

      # Mint a short-lived token scoped to the private homelab repo so we can
      # fetch the production Helm values (which live outside this repo).
      - name: Generate homelab access token
        id: homelab-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.HOMELAB_APP_ID }}
          private-key: ${{ secrets.HOMELAB_APP_PRIVATE_KEY }}
          owner: imaustink
          repositories: homelab

      - name: Checkout homelab (production values)
        uses: actions/checkout@v4
        with:
          repository: imaustink/homelab
          token: ${{ steps.homelab-token.outputs.token }}
          path: homelab
          persist-credentials: false

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Install kubectl
        uses: azure/setup-kubectl@v4

      - name: Docker login
        run: |
          echo "$REGISTRY_PASSWORD" | docker login registry.kurpuis.com:5000 \
            -u "$REGISTRY_USERNAME" --password-stdin
        env:
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Sync migrations
        run: |
          rm -rf helm/glyph/migrations
          cp -r api/migrations helm/glyph/migrations

      - name: Build & push frontend
        run: |
          docker build \
            --build-arg VITE_STORAGE_MODE=api \
            --build-arg VITE_API_URL= \
            -t registry.kurpuis.com:5000/glyph-frontend:latest \
            -f Dockerfile .
          docker push registry.kurpuis.com:5000/glyph-frontend:latest

      - name: Build & push API
        run: |
          docker build \
            -t registry.kurpuis.com:5000/glyph-api:latest \
            -f api/Dockerfile api/
          docker push registry.kurpuis.com:5000/glyph-api:latest

      - name: Helm upgrade
        run: |
          helm upgrade glyph helm/glyph \
            -f homelab/kubernetes/helm/deployments/glyph/values-production.yaml \
            -n glyph --timeout 5m

      - name: Rollout restart
        run: |
          kubectl rollout restart deploy/glyph-frontend deploy/glyph-api -n glyph
          kubectl rollout status deploy/glyph-frontend deploy/glyph-api -n glyph --timeout=5m
