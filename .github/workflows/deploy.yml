name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: arc-runner-set
    # Self-hosted runner: only ever reachable via a successful CI run on main
    # (CI itself only pushes to main via collaborator PRs). Guard so a fork
    # that somehow re-targets this job cannot run it on our infra, and so a
    # failed/cancelled CI run never triggers a deploy.
    if: github.event.workflow_run.conclusion == 'success' && github.repository == 'imaustink/glyph'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      # Mint a short-lived token scoped to the private homelab repo so we can
      # fetch the production Helm values (which live outside this repo).
      - name: Generate homelab access token
        id: homelab-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.HOMELAB_APP_ID }}
          private-key: ${{ secrets.HOMELAB_APP_PRIVATE_KEY }}
          owner: imaustink
          repositories: homelab

      - name: Checkout homelab (production values)
        uses: actions/checkout@v4
        with:
          repository: imaustink/homelab
          token: ${{ steps.homelab-token.outputs.token }}
          path: homelab
          persist-credentials: false

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Install kubectl
        uses: azure/setup-kubectl@v4

      - name: Sync migrations
        run: |
          rm -rf helm/glyph/migrations
          cp -r api/migrations helm/glyph/migrations

      # The image for this commit was already built and pushed by the CI
      # workflow's build-and-push job once all validation passed — deploy
      # only needs to point Helm at that existing :sha tag, not rebuild it.
      - name: Helm upgrade
        run: |
          helm upgrade glyph helm/glyph \
            -f homelab/kubernetes/helm/deployments/glyph/values-production.yaml \
            --set frontend.image.tag=${{ github.event.workflow_run.head_sha }} \
            --set api.image.tag=${{ github.event.workflow_run.head_sha }} \
            -n glyph --timeout 5m

      - name: Rollout restart
        run: |
          kubectl rollout restart deploy/glyph-frontend deploy/glyph-api -n glyph
          kubectl rollout status deploy/glyph-frontend deploy/glyph-api -n glyph --timeout=5m
