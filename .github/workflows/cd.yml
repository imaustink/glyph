name: CD

on:
  push:
    branches: [main]
    paths-ignore:
      - "src-tauri/**"
      - ".github/workflows/release-desktop.yml"
      - ".github/workflows/prepare-desktop-release.yml"
      - ".github/workflows/tag-desktop-release.yml"
  # Redeploy the current tip of main without needing an empty commit — for
  # when a deploy has to be repeated after fixing something outside this repo.
  workflow_dispatch:

permissions:
  contents: read

# Deploys must not overlap. One run starts per push, so merging a batch of PRs
# back-to-back starts a run per merge, and they race: each resolves its own
# image tag, then whichever reaches `helm upgrade` last wins regardless of
# which commit is newer.
#
# That is not hypothetical. On 2026-09-23 three runs overlapped and applied in
# this order:
#
#   04:46:12  #35  db667069
#   04:46:16  #37  c8b66bcf   <- tip of main
#   04:49:47  #34  1ae3b3da   <- oldest of the three, landed last
#
# #34 was last because it had to build its images first (its merge-commit tree
# had no prebuilt tag), which took ~7 minutes while the other two sailed past.
# Production ended up on #34's tree, and because #35 had already applied
# migration 17, the API's `run-migrations` init container went into a
# permanent CrashLoopBackOff — its ConfigMap stopped at 16:
#
#   error: no migration found for version 17
#
# Migrations only roll forward, so that state does not recover on retry.
# Serialising deploys keeps them in merge order, which keeps the schema and
# the binary moving in the same direction.
#
# `cancel-in-progress: false` queues rather than cancels: killing a run midway
# through `helm upgrade` is how releases get stranded in pending-upgrade. Only
# one run is ever queued — GitHub drops an older pending run when a newer one
# arrives — so intermediate commits are skipped and the tip of main ships.
concurrency:
  group: cd-deploy
  cancel-in-progress: false

jobs:
  # The image for this commit's content was usually built and pushed by
  # ci.yml's build-and-push job when it ran on the PR that got merged —
  # tagged by git tree hash rather than commit SHA, since the PR branch's
  # commit SHA and this merge commit's SHA differ (unless every merge is
  # a fast-forward), but the tree hash is identical on both as long as
  # the file contents are unchanged. So deploy just references that tag.
  #
  # ...but not always: a PR from a fork gets no secrets on `pull_request`,
  # so ci.yml skips build-and-push there and the tag is missing. Back it
  # fill here via the shared build-images.yml workflow — `skip-existing` makes
  # every image whose tree-hash manifest already exists a no-op, so this only
  # builds what's actually missing. Fork code only ever reaches a registry
  # credential after a maintainer has reviewed and merged it. The build runs on
  # GitHub-hosted runners; only the deploy job below needs self-hosted.
  build-missing:
    if: github.repository == 'imaustink/glyph'
    uses: ./.github/workflows/build-images.yml
    with:
      skip-existing: true
    secrets: inherit

  deploy:
    needs: build-missing
    if: github.repository == 'imaustink/glyph'
    runs-on: arc-runner-set
    steps:
      - uses: actions/checkout@v4

      # Mint a short-lived token scoped to the private homelab repo so we can
      # fetch the production Helm values (which live outside this repo).
      - name: Generate homelab access token
        id: homelab-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.HOMELAB_APP_ID }}
          private-key: ${{ secrets.HOMELAB_APP_PRIVATE_KEY }}
          owner: imaustink
          repositories: homelab

      - name: Checkout homelab (production values)
        uses: actions/checkout@v4
        with:
          repository: imaustink/homelab
          token: ${{ steps.homelab-token.outputs.token }}
          path: homelab
          persist-credentials: false

      # Pinned: the upgrade below relies on Helm 3's flag semantics (Helm 4
      # changes --wait and renames the rollback flags), and an unpinned
      # installer picks up new majors on its own.
      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.18.4

      - name: Sync migrations
        run: |
          rm -rf helm/glyph/migrations
          cp -r api/migrations helm/glyph/migrations

      - name: Resolve image tag
        id: image
        run: echo "tag=$(git rev-parse HEAD^{tree})" >> "$GITHUB_OUTPUT"

      # collab.image.tag is set unconditionally; the collab Deployment only
      # exists once collab.enabled is turned on in the production values.
      # The repositories are set here too (overriding the production values)
      # so they can't drift from where build-missing / ci.yml pushed.
      #
      # One step does the whole deploy, in order:
      #   1. the pre-upgrade migrate hook Job applies this tree's migrations
      #      (the only place migrations run; API pods just wait for them);
      #   2. the Deployments roll to the new tree-hash tag, and --wait blocks
      #      until every one of them (frontend, api and collab) is ready;
      #   3. on any failure (a failed migration, a pod that never becomes
      #      ready, the timeout) the job fails and the release is marked
      #      failed. It is NOT rolled back automatically (no --atomic):
      #        - the hook has already applied the migrations, and a rollback
      #          to any revision from before PR #46 recreates API pods whose
      #          run-migrations init container runs `migrate up` against a
      #          newer schema and crash-loops ("no migration found for
      #          version N");
      #        - without a rollback, a failed rollout leaves the old
      #          ReplicaSet's pods serving (a RollingUpdate only retires old
      #          pods as new ones become ready), which is the safe state.
      #      --cleanup-on-fail only deletes objects this upgrade newly
      #      created, which the old pods don't use. Recovery (roll forward,
      #      or roll back only to a schema-tolerant revision) is in
      #      docs/runbooks/migrations.md.
      # No separate restart step: a new tag already rolls the pods, and
      # restarting on top rolled the API twice per deploy.
      - name: Helm upgrade
        run: |
          tag=${{ steps.image.outputs.tag }}
          helm upgrade glyph helm/glyph \
            -f homelab/kubernetes/helm/deployments/glyph/values-production.yaml \
            --set frontend.image.repository=docker.io/blackmarket/glyph-frontend \
            --set frontend.image.tag="$tag" \
            --set api.image.repository=docker.io/blackmarket/glyph-api \
            --set api.image.tag="$tag" \
            --set collab.image.repository=docker.io/blackmarket/glyph-collab \
            --set collab.image.tag="$tag" \
            -n glyph --wait --cleanup-on-fail --timeout 10m
