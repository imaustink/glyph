name: CD

on:
  push:
    branches: [main]
    paths-ignore:
      - "src-tauri/**"
      - ".github/workflows/release-desktop.yml"
      - ".github/workflows/prepare-desktop-release.yml"
      - ".github/workflows/tag-desktop-release.yml"

permissions:
  contents: read

jobs:
  build-and-push:
    if: github.repository == 'imaustink/glyph'
    # Self-hosted, arm64 — matches the production cluster's nodes. Building on
    # ubuntu-latest (amd64) produces images that fail with "exec format error"
    # when the kubelet tries to run them.
    runs-on: arc-runner-set
    steps:
      - uses: actions/checkout@v4

      - name: Docker login
        run: |
          echo "$REGISTRY_PASSWORD" | docker login registry.kurpuis.com:5000 \
            -u "$REGISTRY_USERNAME" --password-stdin
        env:
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}

      # Images are tagged with both :latest (convenience) and the immutable
      # commit SHA — the SHA tag is what the deploy job actually deploys, so
      # a given release always refers to a specific, attestable build rather
      # than whatever ":latest" happens to point to at pull time (which can
      # differ between nodes, and gives no way to tell what commit is live).
      - name: Build & push frontend
        run: |
          docker build \
            --build-arg VITE_STORAGE_MODE=api \
            --build-arg VITE_API_URL= \
            -t registry.kurpuis.com:5000/glyph-frontend:latest \
            -t registry.kurpuis.com:5000/glyph-frontend:${{ github.sha }} \
            -f Dockerfile .
          docker push registry.kurpuis.com:5000/glyph-frontend:latest
          docker push registry.kurpuis.com:5000/glyph-frontend:${{ github.sha }}

      - name: Build & push API
        run: |
          docker build \
            -t registry.kurpuis.com:5000/glyph-api:latest \
            -t registry.kurpuis.com:5000/glyph-api:${{ github.sha }} \
            -f api/Dockerfile api/
          docker push registry.kurpuis.com:5000/glyph-api:latest
          docker push registry.kurpuis.com:5000/glyph-api:${{ github.sha }}

  deploy:
    needs: [build-and-push]
    runs-on: arc-runner-set
    steps:
      - uses: actions/checkout@v4

      # Mint a short-lived token scoped to the private homelab repo so we can
      # fetch the production Helm values (which live outside this repo).
      - name: Generate homelab access token
        id: homelab-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.HOMELAB_APP_ID }}
          private-key: ${{ secrets.HOMELAB_APP_PRIVATE_KEY }}
          owner: imaustink
          repositories: homelab

      - name: Checkout homelab (production values)
        uses: actions/checkout@v4
        with:
          repository: imaustink/homelab
          token: ${{ steps.homelab-token.outputs.token }}
          path: homelab
          persist-credentials: false

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Install kubectl
        uses: azure/setup-kubectl@v4

      - name: Sync migrations
        run: |
          rm -rf helm/glyph/migrations
          cp -r api/migrations helm/glyph/migrations

      - name: Helm upgrade
        run: |
          helm upgrade glyph helm/glyph \
            -f homelab/kubernetes/helm/deployments/glyph/values-production.yaml \
            --set frontend.image.tag=${{ github.sha }} \
            --set api.image.tag=${{ github.sha }} \
            -n glyph --timeout 5m

      - name: Rollout restart
        run: |
          kubectl rollout restart deploy/glyph-frontend deploy/glyph-api -n glyph
          kubectl rollout status deploy/glyph-frontend deploy/glyph-api -n glyph --timeout=5m
