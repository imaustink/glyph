name: Publish images

# Force-(re)build and push all three container images for a chosen ref —
# normally the tip of main. Publishing only; this does NOT deploy (cd.yml owns
# rollout to production).
#
# Why this exists: images are tagged by git tree hash, not commit SHA. On a PR
# whose branch is up to date with main the merge is effectively a fast-forward,
# so the merge commit's tree equals the PR-head tree that ci.yml's
# build-and-push already published, and cd.yml deploys that prebuilt image. But
# when a PR is merged while its branch is behind main (branch protection does
# not require branches to be up to date), GitHub writes a real merge commit
# whose tree differs from the PR-head tree. ci.yml built an image for the
# PR-head tree, so the tip-of-main tree has no matching image. cd.yml's
# build-missing job normally backfills it on the push to main, but this is the
# on-demand escape hatch for when it did not (e.g. its run was superseded by a
# newer push in the cd-deploy concurrency group), or when an image otherwise
# needs to be rebuilt.
#
# The matrix, tag scheme and registry login live in the shared build-images.yml
# workflow, which this calls with `force: true`.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref (branch, tag, or SHA) to build from. Defaults to the ref this workflow is dispatched on (tip of main)."
        required: false
        type: string

permissions:
  contents: read

jobs:
  # Force a fresh multi-arch build + push via the shared workflow. `force: true`
  # builds with --pull --no-cache and overwrites the tag even when it already
  # exists, so this also fixes an image whose *contents* (not just the pushed
  # tag) went bad — e.g. a base image that moved under a floating tag — which a
  # cache-reusing rebuild would otherwise reproduce byte-for-byte.
  publish:
    if: github.repository == 'imaustink/glyph'
    uses: ./.github/workflows/build-images.yml
    with:
      # Empty falls back to the ref this workflow was dispatched on (tip of main).
      ref: ${{ inputs.ref }}
      force: true
    secrets: inherit
