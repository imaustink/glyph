    fill="none" stroke="url(#glyphInkMark)" stroke-width="6.78" stroke-linecap="round" stroke-linejoin="round"
  />

  <!-- Monoline "glyph": same round caps and optical weight as the mark. -->
  <g class="glyph-wordmark" transform="translate(82 -3)" fill="none" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="11" cy="31" r="11"/>
