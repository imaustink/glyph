<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 212 64" width="212" height="64" role="img" aria-label="Glyph">
  <title>Glyph</title>
  <defs>
    <linearGradient id="glyphInkMark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#49d1b9"/>
      <stop offset="0.55" stop-color="#2fb8a0"/>
      <stop offset="1" stop-color="#258f7d"/>
    </linearGradient>
    <style>
      /* Set explicitly (not via currentColor) so the lettering still adapts
         when this file is used as an &lt;img src&gt; or a CSS background. */
      .glyph-wordmark { stroke: #20232e; }
      @media (prefers-color-scheme: dark) {
        .glyph-wordmark { stroke: #e8e8e8; }
      }
    </style>
  </defs>

  <path
