<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 212 64" width="212" height="64" role="img" aria-label="Glyph">
  <title>Glyph</title>
  <!--
    Wordmark variant where BOTH the mark and the lettering use currentColor.
    Intended to be inlined in the DOM so it can be pinned to an exact theme
    token such as var(--text-heading). Use this instead of logo-wordmark.svg
    anywhere the background is fixed by the app rather than by the OS scheme.
  -->
