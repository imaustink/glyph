# Helm values for running Glyph's Playwright E2E suite against a local
# Kubernetes cluster (ferry). Applied by scripts/test-e2e-k8s.sh.
#
# Differences from a real deployment:
#   * Images are the locally built `:e2e` tags in the node's image store, so
#     pullPolicy must be Never — there is no registry to fetch them from.
#   * api.devAuth disables authentication and exposes /test/reset +
#     /test/become, which e2e/fixtures.ts calls before every test.
#   * Everything is scaled to one replica and sized for a laptop.
#
# The suite reaches the app through the chart's own Ingress, served by ferry's
# Traefik addon. frontend.origin, api.frontendUrl and collab.allowedOrigins are
# overridden with --set by the script: the origin includes Traefik's node port,
# which ferry allocates per profile.

frontend:
  replicaCount: 1

  image:
    repository: glyph-frontend-api
    tag: e2e
    pullPolicy: Never

  # Overridden by the script with the Ingress origin.
  origin: "http://localhost"

  # The Playwright fixtures call `${baseURL}/test/reset` and `/test/become`.
  # The Ingress deliberately has no /test route — it is not a production path
  # — so /test falls through to the frontend, which proxies it to the API.
  # E2E_RESET_ENABLED is what lets /test/* through that proxy (see
  # src/hooks.server.ts). /api and /collab go straight from the Ingress to
  # their services, as in production.
  extraEnv:
    - name: API_PROXY_TARGET
      value: "http://glyph-api:8080"
    - name: E2E_RESET_ENABLED
      value: "true"

  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: "1"
      memory: 512Mi

api:
  replicaCount: 1

  image:
    repository: glyph-api
    tag: e2e
    pullPolicy: Never

  # No OIDC in tests: dev-auth mode authenticates every request as the fixed
  # "Dev User" and registers /test/reset + /test/become. The chart always sets
  # GIN_MODE=release, which is exactly the case the API refuses to start in
  # without this explicit opt-in (api/cmd/api/auth.go).
  devAuth: true

  # Must be hex (the API hex-decodes it and fatals otherwise). Fixed and
  # obviously fake — dev-auth mode never validates a signed session.
  sessionSecret: "e2ee2ee2ee2ee2ee2ee2ee2ee2ee2ee2ee2ee2ee2ee2ee2ee2ee2ee2ee2ee2ee"

  # Overridden by the script with the Ingress origin.
  frontendUrl: "http://localhost"
  # Plain http on localhost: a Secure cookie would never be stored, and a
  # cookie Domain would not match `localhost`. /test/become sets dev_user_id
  # this way, and the user-switching specs depend on it coming back.
  cookieDomain: ""
  cookieSecure: "false"

  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: "1"
      memory: 512Mi

cnpg:
  # Single instance — no replicas to fail over to, and one less pod VM.
  instances: 1

  storage:
    size: 2Gi

  parameters:
    shared_buffers: "64MB"
    max_connections: "100"

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi

# The api project runs with realtime collaboration on (playwright.config.ts),
# so every editing spec goes through this service — as it does in the Compose
# stack. The browser reaches it at same-origin /collab through the Ingress.
collab:
  enabled: true
  replicaCount: 1

  image:
    repository: glyph-collab
    tag: e2e
    pullPolicy: Never

  # Matches docker-compose.test.yml; fixed and obviously fake.
  serviceToken: "e2e-collab-service-token"

  # Overridden by the script with the Ingress origin.
  allowedOrigins: "http://localhost"

  # Tests reload quickly after typing; persist promptly (same as Compose).
  extraEnv:
    - name: COLLAB_STORE_DEBOUNCE_MS
      value: "300"
    - name: COLLAB_STORE_MAX_DEBOUNCE_MS
      value: "1000"
    - name: COLLAB_REAUTH_INTERVAL_MS
      value: "5000"

  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: "1"
      memory: 512Mi

# The chart's own Ingress, so its routing is under test along with the app.
# `localhost` needs no DNS or /etc/hosts entry, and the local-mode frontend
# (e2e/k8s/frontend-local.yaml) takes every other host, which the suite reaches
# as 127.0.0.1. The browser gets HTTP on Traefik's node port; see
# scripts/test-e2e-k8s.sh for why not port 80.
ingress:
  enabled: true
  className: traefik
  hosts:
    - host: localhost
  tls: []
