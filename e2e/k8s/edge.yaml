# A same-origin front door for the api-mode frontend, standing in for the
# Ingress a real deployment has. The browser opens the collaboration WebSocket
# at same-origin /collab (src/lib/collab/client.ts), and the SvelteKit server
# cannot proxy a WebSocket upgrade (src/hooks.server.ts) — so without this,
# the frontend image would need VITE_COLLAB_URL baked in with a host port that
# scripts/test-e2e-k8s.sh only allocates at run time.
#
# Routes /collab (WebSocket and HTTP) to the collab service and everything else
# to the frontend, which proxies /api and /test to the API itself
# (API_PROXY_TARGET in values.e2e.yaml).
apiVersion: v1
kind: ConfigMap
metadata:
  name: glyph-edge
  labels:
    app.kubernetes.io/name: glyph
    app.kubernetes.io/component: edge
data:
  default.conf: |
    map $http_upgrade $connection_upgrade {
      default upgrade;
      ''      '';
    }

    # Keep upstream connections open and reuse them. Without this nginx dials
    # a new connection per request, and each one is a conntrack entry in this
    # pod's kernel (Services are DNAT'd inside every pod on ferry) that lingers
    # for minutes. A ferry pod VM's table holds ~6k entries: a single suite run
    # filled it, and the kernel then dropped packets — the port-forward and
    # the readiness probe alike timed out for tens of seconds at a time.
    upstream frontend {
      server glyph-frontend:3000;
      keepalive 16;
    }

    upstream collab {
      server glyph-collab:1235;
      keepalive 16;
    }

    server {
      listen 8080;

      # Host keeps its port ($http_host, not $host): the collab service and
      # SvelteKit both compare it with the browser's Origin.
      location /collab {
        proxy_pass http://collab;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
      }

      location / {
        proxy_pass http://frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Connection "";
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: glyph-edge
  labels:
    app.kubernetes.io/name: glyph
    app.kubernetes.io/component: edge
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: glyph
      app.kubernetes.io/component: edge
  template:
    metadata:
      labels:
        app.kubernetes.io/name: glyph
        app.kubernetes.io/component: edge
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          image: nginxinc/nginx-unprivileged:1.27-alpine
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/conf.d
              readOnly: true
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 128Mi
      volumes:
        - name: config
          configMap:
            name: glyph-edge
---
apiVersion: v1
kind: Service
metadata:
  name: glyph-edge
  labels:
    app.kubernetes.io/name: glyph
    app.kubernetes.io/component: edge
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: glyph
    app.kubernetes.io/component: edge
