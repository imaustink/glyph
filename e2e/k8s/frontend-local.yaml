# The `local` Playwright project exercises the localStorage backend, which the
# Helm chart has no concept of — the chart always deploys the API-mode
# frontend against Postgres. VITE_STORAGE_MODE is baked in at build time, so
# local mode needs its own image and its own Deployment alongside the release.
#
# `__ORIGIN__` is substituted by scripts/test-e2e-k8s.sh with the origin the
# suite reaches this app at through the Ingress below.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: glyph-frontend-local
  labels:
    app.kubernetes.io/name: glyph
    app.kubernetes.io/component: frontend-local
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: glyph
      app.kubernetes.io/component: frontend-local
  template:
    metadata:
      labels:
        app.kubernetes.io/name: glyph
        app.kubernetes.io/component: frontend-local
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: frontend
          image: glyph-frontend-local:e2e
          imagePullPolicy: Never
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: HOST
              value: "0.0.0.0"
            - name: PORT
              value: "3000"
            - name: NODE_ENV
              value: "production"
            - name: ORIGIN
              value: "__ORIGIN__"
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: glyph-frontend-local
  labels:
    app.kubernetes.io/name: glyph
    app.kubernetes.io/component: frontend-local
spec:
  type: ClusterIP
  ports:
    - port: 3000
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: glyph
    app.kubernetes.io/component: frontend-local
---
# No host: every request that does not name `localhost` (the chart's Ingress
# for the api-mode app) lands here. The suite reaches it as 127.0.0.1, which
# needs no DNS — and an Ingress host cannot be an IP address.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: glyph-frontend-local
  labels:
    app.kubernetes.io/name: glyph
    app.kubernetes.io/component: frontend-local
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: glyph-frontend-local
                port:
                  name: http
