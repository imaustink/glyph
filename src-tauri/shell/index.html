<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Connect to Glyph</title>
<style>
  :root {
    color-scheme: light dark;
  }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0f172a;
    color: #e2e8f0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  main {
    width: min(90vw, 420px);
    padding: 2rem;
  }
  h1 {
    font-size: 1.25rem;
    margin: 0 0 0.5rem;
  }
  p {
    color: #94a3b8;
    margin: 0 0 1.5rem;
    font-size: 0.9rem;
  }
  form {
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
  }
  input {
    padding: 0.65rem 0.75rem;
    border-radius: 6px;
    border: 1px solid #334155;
    background: #1e293b;
    color: #e2e8f0;
    font-size: 0.95rem;
  }
  input:focus {
    outline: 2px solid #38bdf8;
    outline-offset: 1px;
  }
  button {
    padding: 0.65rem 0.75rem;
    border-radius: 6px;
    border: none;
    background: #38bdf8;
    color: #0f172a;
    font-weight: 600;
    cursor: pointer;
  }
  button:disabled {
    opacity: 0.6;
    cursor: default;
  }
  #error {
    color: #f87171;
    font-size: 0.85rem;
    margin-top: 0.75rem;
  }
</style>
</head>
<body>
  <main>
    <h1>Connect to your Glyph server</h1>
    <p>Enter the URL of your self-hosted Glyph instance to get started.</p>
    <form id="connect-form">
      <input
        id="server-url"
        type="url"
        placeholder="https://glyph.example.com"
        autocomplete="url"
        required
      />
      <button type="submit">Connect</button>
    </form>
    <p id="error" hidden></p>
  </main>
  <script>
    const form = document.getElementById("connect-form");
    const input = document.getElementById("server-url");
    const errorEl = document.getElementById("error");
    const button = form.querySelector("button");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      errorEl.hidden = true;
      button.disabled = true;
      try {
        await window.__TAURI__.core.invoke("set_server_url", {
          url: input.value.trim(),
        });
      } catch (err) {
        errorEl.textContent = String(err);
        errorEl.hidden = false;
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
