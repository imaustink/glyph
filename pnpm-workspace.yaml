packages:
  # Realtime collaboration server (Hocuspocus). Shares the editor schema with
  # the frontend by importing it from src/lib/editor.
  - collab

# Approve the one dependency build script we rely on. pnpm 12 refuses to run
# dependency build scripts unless allow-listed and fails `pnpm install
# --frozen-lockfile` with ERR_PNPM_IGNORED_BUILDS otherwise. esbuild's
# postinstall fetches its platform binary, which vite/vitest need.
allowBuilds:
  esbuild: true

overrides:
  # Svelte devalue advisories (DoS via sparse-array deserialization and
  # related uneval/CPU amplification, __proto__ bypass) — pulled in
  # transitively via svelte/@sveltejs/kit. Patched in 5.9.3; cap below 6 so
  # engine-strict doesn't trip on 6.x's Node >=22.17 requirement.
  "devalue@<5.9.3": ">=5.9.3 <6"
  # Pin yjs (and every y-* peer resolves against it) to 13.6.32. 13.6.33 was
  # published within the CI minimum-release-age (supply-chain) window, which
  # fails `pnpm install --frozen-lockfile`. Bump once 13.6.33+ clears the gate.
  "yjs": "13.6.32"
