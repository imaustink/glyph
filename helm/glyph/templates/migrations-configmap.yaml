# Migrations for the install-time migrate Job and for each API pod's
# wait-for-schema check. (Upgrades migrate from <fullname>-migrations-hook —
# see migrate-job.yaml — because a pre-upgrade hook runs before this
# ConfigMap is updated.)
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "glyph.fullname" . }}-migrations
  labels:
    {{- include "glyph.labels" . | nindent 4 }}

data:
  {{- include "glyph.migrations.data" . | trim | nindent 2 }}
