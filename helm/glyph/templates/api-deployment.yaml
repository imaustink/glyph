apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "glyph.fullname" . }}-api
  labels:
    {{- include "glyph.api.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.api.replicaCount }}
  selector:
    matchLabels:
      {{- include "glyph.api.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "glyph.api.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.api.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wait-for-db
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Waiting for database to become ready..."
              until nc -z {{ include "glyph.cnpg.clusterName" . }}-rw 5432; do
                echo "Database not ready yet, retrying in 2s..."
                sleep 2
              done
              echo "Database is ready."
        - name: run-migrations
          image: "{{ .Values.migrate.image.repository }}:{{ .Values.migrate.image.tag }}"
          imagePullPolicy: {{ .Values.migrate.image.pullPolicy }}
          command:
            - migrate
            - -path
            - /migrations
            - -database
            - $(DATABASE_URL)
            - up
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "glyph.databaseSecretName" . }}
                  key: uri
          volumeMounts:
            - name: migrations
              mountPath: /migrations
      containers:
        - name: api
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: PORT
              value: "8080"
            - name: GIN_MODE
              value: "release"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "glyph.databaseSecretName" . }}
                  key: uri
            {{- if .Values.api.oidc.enabled }}
            - name: OIDC_ISSUER_URL
              value: {{ .Values.api.oidc.issuerUrl | quote }}
            - name: OIDC_CLIENT_ID
              value: {{ .Values.api.oidc.clientId | quote }}
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.api.existingSecret | default (.Values.api.oidc.existingSecret | default (printf "%s-oidc" (include "glyph.fullname" .))) }}
                  key: {{ .Values.api.existingSecretKeys.oidcClientSecret | default "client-secret" }}
            - name: OIDC_REDIRECT_URL
              value: {{ .Values.api.oidc.redirectUrl | quote }}
            {{- end }}
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.api.existingSecret | default (printf "%s-session" (include "glyph.fullname" .)) }}
                  key: {{ .Values.api.existingSecretKeys.sessionSecret | default "secret" }}
            - name: FRONTEND_URL
              value: {{ .Values.api.frontendUrl | quote }}
            - name: COOKIE_DOMAIN
              value: {{ .Values.api.cookieDomain | quote }}
            - name: COOKIE_SECURE
              value: {{ .Values.api.cookieSecure | quote }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
      {{- with .Values.api.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        - name: migrations
          configMap:
            name: {{ include "glyph.fullname" . }}-migrations
