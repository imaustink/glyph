{{- if .Values.collab.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "glyph.fullname" . }}-collab
  labels:
    {{- include "glyph.collab.labels" . | nindent 4 }}
spec:
  type: {{ .Values.collab.service.type }}
  ports:
    - port: {{ .Values.collab.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "glyph.collab.selectorLabels" . | nindent 4 }}
{{- end }}
