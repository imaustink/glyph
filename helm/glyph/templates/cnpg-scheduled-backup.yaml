{{- if .Values.cnpg.backup.enabled }}
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: {{ include "glyph.cnpg.clusterName" . }}-backup
  labels:
    {{- include "glyph.labels" . | nindent 4 }}
spec:
  schedule: {{ include "glyph.cnpg.backupSchedule" . | quote }}
  backupOwnerReference: self
  target: {{ .Values.cnpg.backup.target }}
  {{- if eq .Values.cnpg.backup.method "plugin" }}
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
  {{- else }}
  method: barmanObjectStore
  {{- end }}
  cluster:
    name: {{ include "glyph.cnpg.clusterName" . }}
{{- end }}
