{{- /*
Demo data for disposable installs (PR previews): `/api seed-demo` creates a
"Glyph Demo" organization through the real API handlers and installs a
trigger that makes every user who signs in an editor of it (see
api/internal/seed). It is idempotent, so it simply runs after every sync;
later runs only add missing members. Never enable this in production: the
command refuses without GLYPH_SEED_DEMO=true, which only this Job sets.

Runs after everything is healthy (Argo CD PostSync, or Helm post-install /
post-upgrade), so the migrations it waits for have already applied.
*/}}
{{- if .Values.seed.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "glyph.fullname" . }}-seed
  labels:
    {{- include "glyph.labels" . | nindent 4 }}
    app.kubernetes.io/component: seed
  annotations:
    {{- if .Values.argocd.enabled }}
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    {{- else }}
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation
    {{- end }}
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        {{- include "glyph.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: seed
    spec:
      restartPolicy: OnFailure
      {{- with .Values.api.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: seed
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          args: ["seed-demo"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          env:
            - name: GLYPH_SEED_DEMO
              value: "true"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "glyph.databaseSecretName" . }}
                  key: uri
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
      {{- with .Values.api.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
