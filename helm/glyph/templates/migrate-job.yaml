apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "glyph.migrate.name" . }}-{{ .Release.Revision }}
  labels:
    {{- include "glyph.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate

spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        {{- include "glyph.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: OnFailure
      {{- with .Values.migrate.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        # Wait for CNPG cluster to be ready before running migrations
        - name: wait-for-db
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Waiting for database to become ready..."
              until nc -z {{ include "glyph.cnpg.clusterName" . }}-rw 5432; do
                echo "Database not ready yet, retrying in 2s..."
                sleep 2
              done
              echo "Database is ready."
      containers:
        - name: migrate
          image: "{{ .Values.migrate.image.repository }}:{{ .Values.migrate.image.tag }}"
          imagePullPolicy: {{ .Values.migrate.image.pullPolicy }}
          command:
            - migrate
            - -path
            - /migrations
            - -database
            - $(DATABASE_URL)
            - up
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "glyph.databaseSecretName" . }}
                  key: uri
          volumeMounts:
            - name: migrations
              mountPath: /migrations
      volumes:
        - name: migrations
          configMap:
            name: {{ include "glyph.fullname" . }}-migrations
