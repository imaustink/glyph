{{- if not .Values.api.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "glyph.fullname" . }}-session
  labels:
    {{- include "glyph.labels" . | nindent 4 }}
type: Opaque
{{- if .Values.api.sessionSecret }}
data:
  secret: {{ .Values.api.sessionSecret | b64enc | quote }}
{{- else }}
stringData:
  secret: ""
{{- end }}
{{- end }}
---
{{- if and .Values.collab.enabled (not .Values.collab.existingSecret) }}
{{- if not .Values.collab.serviceToken }}
{{- fail "collab.serviceToken (or collab.existingSecret) is required when collab.enabled is true. Generate one with: openssl rand -hex 32" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "glyph.collab.secretName" . }}
  labels:
    {{- include "glyph.labels" . | nindent 4 }}
type: Opaque
data:
  service-token: {{ .Values.collab.serviceToken | b64enc | quote }}
{{- end }}
---
{{- if and .Values.api.oidc.enabled (not .Values.api.oidc.existingSecret) (not .Values.api.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "glyph.fullname" . }}-oidc
  labels:
    {{- include "glyph.labels" . | nindent 4 }}
type: Opaque
data:
  client-secret: {{ .Values.api.oidc.clientSecret | b64enc | quote }}
{{- end }}
