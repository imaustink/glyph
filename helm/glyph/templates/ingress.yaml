{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "glyph.fullname" . }}
  labels:
    {{- include "glyph.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- if .Values.ingress.tls }}
  tls:
    {{- range .Values.ingress.tls }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          - path: /api/
            pathType: Prefix
            backend:
              service:
                name: {{ include "glyph.fullname" $ }}-api
                port:
                  name: http
          - path: /auth/
            pathType: Prefix
            backend:
              service:
                name: {{ include "glyph.fullname" $ }}-api
                port:
                  name: http
          # /oauth/token and /oauth/revoke — the machine-facing OAuth 2.0
          # protocol endpoints (see internal/oauth/routes.go). Without this,
          # the delegated-auth feature is registered on the API but
          # unreachable in production. /oauth/authorize is deliberately NOT
          # routed here — it's the frontend's own consent page route; its
          # API calls go through /api/v1/oauth/consent, already covered by
          # the /api/ rule above.
          - path: /oauth/token
            pathType: Exact
            backend:
              service:
                name: {{ include "glyph.fullname" $ }}-api
                port:
                  name: http
          - path: /oauth/revoke
            pathType: Exact
            backend:
              service:
                name: {{ include "glyph.fullname" $ }}-api
                port:
                  name: http
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "glyph.fullname" $ }}-frontend
                port:
                  name: http
    {{- end }}
{{- end }}
