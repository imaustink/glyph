{{- if .Values.collab.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "glyph.fullname" . }}-collab
  labels:
    {{- include "glyph.collab.labels" . | nindent 4 }}
spec:
  # One replica is the recommended default. More are safe — the update log is
  # append-only and every snapshot is epoch- and sequence-checked — but
  # editors connected to different replicas only see each other's changes
  # every COLLAB_CATCH_UP_INTERVAL_MS rather than live.
  replicas: {{ .Values.collab.replicaCount }}
  selector:
    matchLabels:
      {{- include "glyph.collab.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "glyph.collab.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.collab.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      # Documents are persisted (and snapshotted) on shutdown, including
      # ones still retrying after a database outage; give that time. Must
      # exceed preStopSleepSeconds plus the service's own drain limit.
      terminationGracePeriodSeconds: {{ .Values.collab.terminationGracePeriodSeconds }}
      containers:
        - name: collab
          image: "{{ .Values.collab.image.repository }}:{{ .Values.collab.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.collab.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 1235
              protocol: TCP
          {{- if .Values.collab.preStopSleepSeconds }}
          # Keep serving while the endpoint removal propagates, so no new
          # WebSocket lands on a pod that is about to shut down.
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "{{ .Values.collab.preStopSleepSeconds }}"]
          {{- end }}
          env:
            - name: PORT
              value: "1235"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "glyph.databaseSecretName" . }}
                  key: uri
            - name: API_URL
              value: "http://{{ include "glyph.fullname" . }}-api:{{ .Values.api.service.port }}"
            - name: COLLAB_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "glyph.collab.secretName" . }}
                  key: {{ .Values.collab.existingSecretKey | default "service-token" }}
            {{- if .Values.collab.allowedOrigins }}
            - name: COLLAB_ALLOWED_ORIGINS
              value: {{ .Values.collab.allowedOrigins | quote }}
            {{- end }}
            {{- with .Values.collab.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /collab/healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /collab/healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            {{- toYaml .Values.collab.resources | nindent 12 }}
      {{- with .Values.collab.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.collab.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
