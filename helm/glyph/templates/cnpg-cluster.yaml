{{- include "glyph.cnpg.validateBackup" . }}
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ include "glyph.cnpg.clusterName" . }}
  {{- if or .Values.cnpg.retainOnDelete .Values.argocd.enabled }}
  annotations:
    {{- if .Values.cnpg.retainOnDelete }}
    # The database outlives the release: `helm uninstall`, an Argo prune or
    # app deletion, or a chart refactor must never delete it. Delete it by
    # hand if you mean to. (Helm and Argo CD each honour only their own
    # annotation.)
    helm.sh/resource-policy: keep
    argocd.argoproj.io/sync-options: Delete=false
    {{- end }}
    {{- if .Values.argocd.enabled }}
    # Exists before the migrate hook Job (wave -1) that waits for it.
    argocd.argoproj.io/sync-wave: "-2"
    {{- end }}
  {{- end }}
  labels:
    {{- include "glyph.labels" . | nindent 4 }}
    app.kubernetes.io/component: database
spec:
  instances: {{ .Values.cnpg.instances }}
  imageName: {{ .Values.cnpg.imageName | quote }}

  postgresql:
    parameters:
      {{- toYaml .Values.cnpg.parameters | nindent 6 }}

  bootstrap:
    initdb:
      database: {{ .Values.cnpg.database }}
      owner: {{ .Values.cnpg.owner }}

  storage:
    size: {{ .Values.cnpg.storage.size }}
    {{- if .Values.cnpg.storage.storageClass }}
    storageClass: {{ .Values.cnpg.storage.storageClass }}
    {{- end }}

  {{- with .Values.cnpg.primaryUpdateMethod }}
  primaryUpdateMethod: {{ . }}
  {{- end }}

  {{- if .Values.cnpg.backup.enabled }}
  {{- if eq .Values.cnpg.backup.method "plugin" }}
  # WAL archiving and base backups through the Barman Cloud plugin, to the
  # ObjectStore in cnpg-objectstore.yaml.
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: {{ include "glyph.cnpg.objectStoreName" . }}
  {{- else }}
  backup:
    target: {{ .Values.cnpg.backup.target }}
    barmanObjectStore:
      {{- include "glyph.cnpg.barmanConfiguration" . | nindent 6 }}
    retentionPolicy: {{ .Values.cnpg.backup.retentionPolicy | quote }}
  {{- end }}
  {{- end }}

  resources:
    {{- toYaml .Values.cnpg.resources | nindent 4 }}

  {{- if .Values.cnpg.monitoring.enabled }}
  monitoring:
    enablePodMonitor: true
  {{- end }}
