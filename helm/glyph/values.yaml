# -- Override the chart name
nameOverride: ""
# -- Override the full release name
fullnameOverride: ""

# =============================================================================
# Frontend (SvelteKit app)
# =============================================================================
frontend:
  replicaCount: 2

  image:
    repository: ghcr.io/glyph/frontend
    tag: ""  # defaults to Chart.appVersion
    pullPolicy: IfNotPresent

  imagePullSecrets: []

  # ORIGIN used by SvelteKit for CSRF protection — must match the public URL
  origin: "https://glyph.example.com"

  # -- Extra environment variables for the frontend container, in full
  # `name`/`value` (or `valueFrom`) form. Mainly for deployments that serve
  # the API through the SvelteKit process rather than via the Ingress rules
  # (e.g. API_PROXY_TARGET / E2E_RESET_ENABLED — see src/hooks.server.ts).
  extraEnv: []

  service:
    type: ClusterIP
    port: 3000

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

  nodeSelector: {}
  tolerations: []

# =============================================================================
# API (Go / Gin)
# =============================================================================
api:
  replicaCount: 2

  image:
    repository: ghcr.io/glyph/api
    tag: ""  # defaults to Chart.appVersion
    pullPolicy: IfNotPresent

  imagePullSecrets: []

  # Public URL the frontend runs on — used for CORS and OIDC redirects
  frontendUrl: "https://glyph.example.com"
  cookieDomain: "glyph.example.com"
  cookieSecure: "true"

  # Session secret, hex-encoded — `openssl rand -hex 32`. The API hex-decodes
  # this and fatals on anything else, so a plain passphrase will not boot.
  # Required — the API fatals on boot if this and
  # existingSecret are both empty. (It is never auto-generated in this
  # chart: GIN_MODE=release is always set below, and the API refuses to
  # generate a random per-process secret in release mode, since that would
  # invalidate every session on each restart/replica.)
  sessionSecret: ""

  # Dev-auth mode disables authentication entirely (every request is treated
  # as an authenticated "Dev User") and exposes /test/reset + /test/become.
  # The API refuses to start in this mode under GIN_MODE=release (which this
  # chart always sets) unless this is explicitly true — set it only for a
  # deliberately auth-less deployment (e.g. an internal demo), never as a
  # substitute for configuring oidc below.
  devAuth: false

  # Use an existing secret for both session and OIDC credentials.
  # The secret must contain keys matching existingSecretKeys below.
  existingSecret: ""
  existingSecretKeys:
    sessionSecret: "secret"
    oidcClientSecret: "client-secret"

  # OIDC (OpenID Connect) configuration
  oidc:
    enabled: false
    issuerUrl: ""
    clientId: ""
    clientSecret: ""
    redirectUrl: ""
    # Use an existing secret instead of creating one (key: client-secret)
    existingSecret: ""

  # -- Extra environment variables for the API container, in full
  # `name`/`value` (or `valueFrom`) form.
  extraEnv: []

  service:
    type: ClusterIP
    port: 8080

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

  nodeSelector: {}
  tolerations: []

# =============================================================================
# Collab (realtime collaborative editing — Hocuspocus / Yjs)
# =============================================================================
collab:
  # Off by default. When on, a note opened in the browser is edited live with
  # anyone else who has it open, through this service. Turning it off again
  # is safe: editors fall back to single-writer mode, and each note is
  # detached from its collaborative log on its next save.
  enabled: false

  replicaCount: 1

  image:
    repository: ghcr.io/glyph/collab
    tag: ""  # defaults to Chart.appVersion
    pullPolicy: IfNotPresent

  imagePullSecrets: []

  # Shared secret for the collab service's calls to the API's /internal
  # routes — `openssl rand -hex 32`. Required when enabled, unless
  # existingSecret is set.
  serviceToken: ""
  existingSecret: ""
  existingSecretKey: "service-token"

  # Origins allowed to open a collaboration WebSocket (comma-separated).
  # Empty = same-origin only (the Origin must match the Host the Ingress
  # forwards), which is right when the app and /collab share a hostname.
  allowedOrigins: ""

  # -- Extra environment variables, e.g. COLLAB_STORE_DEBOUNCE_MS,
  # COLLAB_CATCH_UP_INTERVAL_MS (see collab/src/config.ts).
  extraEnv: []

  # Ingress controllers with short upstream read timeouts will drop idle
  # WebSockets. For ingress-nginx, for example:
  #   nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
  #   nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
  # (Traefik, the k3s default, needs nothing.)
  ingressAnnotationsHint: {}

  service:
    type: ClusterIP
    port: 1235

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

  nodeSelector: {}
  tolerations: []

# =============================================================================
# Database — CloudNativePG (CNPG)
# =============================================================================
cnpg:
  # Number of PostgreSQL instances (1 primary + N-1 replicas)
  instances: 3

  # PostgreSQL image
  imageName: "ghcr.io/cloudnative-pg/postgresql:16.4"

  # Database bootstrap settings
  database: glyph
  owner: glyph

  # PostgreSQL parameters
  parameters:
    shared_buffers: "256MB"
    max_connections: "100"

  storage:
    size: 10Gi
    # storageClass: ""  # Uses default StorageClass if not set

  backup:
    enabled: false
    # Cron schedule for backups
    schedule: "0 0 * * *"
    retentionPolicy: "30d"
    # S3-compatible object storage destination: s3://<bucket>/<prefix>
    destinationPath: ""
    # Custom S3 endpoint (required for non-AWS providers like Cloudflare R2, MinIO).
    # Leave empty for AWS S3.
    endpointURL: ""
    s3:
      secretName: ""  # Secret with ACCESS_KEY_ID and ACCESS_SECRET_KEY keys

  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi

  monitoring:
    enabled: false

# =============================================================================
# Database migrations (golang-migrate)
# =============================================================================
migrate:
  image:
    repository: migrate/migrate
    tag: "v4.17.0"
    pullPolicy: IfNotPresent

  imagePullSecrets: []

# =============================================================================
# Ingress
# =============================================================================
ingress:
  enabled: false
  className: ""
  annotations: {}
    # cert-manager.io/cluster-issuer: letsencrypt-prod
    # nginx.ingress.kubernetes.io/proxy-body-size: "10m"
  hosts:
    - host: glyph.example.com
  tls: []
    # - secretName: glyph-tls
    #   hosts:
    #     - glyph.example.com
